<!doctype html>

  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/bulma.min.css">
  <link rel="stylesheet" href="/styles.css">
  <title>SmallCats</title>

<body>
  <header>
    <nav class="navbar has-shadow" aria-label="Main navigation">
